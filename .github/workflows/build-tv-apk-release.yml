name: Build TV APK (Release)

# Manually triggered. Builds the :app module's fullRelease variant (minify +
# shrinkResources, R8) and uploads both ABI-split APKs (armeabi-v7a +
# arm64-v8a) — the APKs for phone installs.
#
# Signing: the release key lives in GitHub Secrets (Spec 49 R1). The keystore
# itself is a base64 secret (NUVIO_RELEASE_KEYSTORE_BASE64); the step below
# decodes it to nuviotv.jks and the build step passes it plus the alias and
# passwords through the NUVIO_RELEASE_* env vars build.gradle.kts reads.
# A release build without these secrets fails at signing instead of signing
# with a guessable password — and it must never fall back to the debug key,
# or installed devices could not update to the next release.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Write release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "NUVIO_RELEASE_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > nuviotv.jks

      - name: Build TV APK (fullRelease)
        env:
          NUVIO_RELEASE_STORE_FILE: ${{ github.workspace }}/nuviotv.jks
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
        # --stacktrace: the debug workflow's packageFullDebug once failed with
        # an empty exception message (OOM, fixed by the 4 GB daemon heap);
        # keep the flag for the first release builds, where R8 runs for the
        # first time on this port.
        run: ./gradlew :app:assembleFullRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-enhanced-tv-release-apk
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
