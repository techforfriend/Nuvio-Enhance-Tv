# local.properties template — the tracking home for build configuration.
# Inventory with per-key verdicts: docs/project/build-config-audit-2026-08-28.md
# Fields are read by app/build.gradle.kts; blank values bake silently and kill
# features at runtime — keep REQUIRED keys filled before any release build.
# NEVER commit real values: this file is the template, local.properties is gitignored.

# ---- REQUIRED: account backend (QR login, sync, profiles) ----
# Official host; release builds blank -> every account RPC fails ("QR unavailable").
NUVIO_SUPABASE_URL=https://api.nuvio.tv
# JWT anon key for the account project (role=anon; client-embedded by design).
NUVIO_SUPABASE_ANON_KEY=your_supabase_anon_key_here

# ---- REQUIRED for their features (blank = feature silently off) ----
# Skip-intro lookup (SkipIntroRepository).
INTRODB_API_URL=https://api.introdb.app/
# IMDb ratings via SeriesGraph API.
IMDB_RATINGS_API_BASE_URL=https://seriesgraph.com/
# IMDb ratings via tapframe API.
IMDB_TAPFRAME_API_BASE_URL=https://imdb.tapframe.space/
# Direct TMDB enrichment + IMDb->TMDB id lookup. Blank in all local builds 2026-08-28 and
# earlier; upstream hides its key in native code. REQUIRES a real key since 2026-08-29:
# TMDB-backed collection folders and direct TMDB lookups 401 with an empty key (ke8 finding).
# Free key from themoviedb.org if wanted.
TMDB_API_KEY=

# ---- OPTIONAL (safe to leave blank; see audit table for behavior) ----
# Secondary account host, tried when the primary fails. Blank = skipped.
NUVIO_SUPABASE_FALLBACK_URL=
# Redirect base encoded into TV-login sessions. Default: https://nuvio.tv/tv-login
TV_LOGIN_WEB_BASE_URL=
# Profile avatars. Blank = avatars off (upstream parity). Host only, e.g. https://api.nuvio.tv
AVATAR_PUBLIC_BASE_URL=
# Update check feed (GitHub owner/repo whose Releases a public build checks; Spec 52 P6).
# Defaults: techforfriend / Nuvio-Enhance-Tv. Only a build with a blank TMDB_API_KEY checks at all.
# UPDATE_OWNER=
# UPDATE_REPO=

# ---- Release signing (secret; no defaults: release builds need these or CI_USE_DEBUG_SIGNING=true) ----
# NUVIO_RELEASE_STORE_FILE / NUVIO_RELEASE_KEY_ALIAS / NUVIO_RELEASE_KEY_PASSWORD / NUVIO_RELEASE_STORE_PASSWORD
# Losing nuviotv.jks breaks the upgrade chain for installed devices — never delete or regenerate
# without explicit instruction (root AGENTS.md, Security rules).

# ---- Build toggles ----
# Set true only to build the local ffmpeg-decoder-downmix module (then set FFMPEG_SOURCE_DIR /
# FFMPEG_BUILD_DIR). Default: false (bundled AAR used).
USE_LOCAL_FFMPEG_DECODER=false
# Required only when USE_LOCAL_FFMPEG_DECODER=true
FFMPEG_SOURCE_DIR=path_to_ffmpeg_source_tree
FFMPEG_BUILD_DIR=path_to_ffmpeg_build_root

# ---- DV7 / libdovi (Dolby Vision Profile 7 to 8.1) ----

# Build the dovi_bridge native lib + load the runtime bridge.
DOVI_NATIVE_ENABLED=true

# Marks extractor hook integration as available in the current build.
DOVI_EXTRACTOR_HOOK_READY=true

# Link the prebuilt libdovi static archive into dovi_bridge.
DOVI_ENABLE_REAL_LINK=true
# Optional explicit overrides (otherwise resolved from the prebuilt root below):
# DOVI_LIBDOVI_STATIC_LIB=/path/to/libdovi.a
# DOVI_LIBDOVI_INCLUDE_DIR=/path/to/libdovi/include
DOVI_LIBDOVI_PREBUILT_ROOT=DV7/libdovi

# MKV per-sample DV/HDR10+ rewrite: native (default, true) or the Kotlin path (false; Spec 21
# N4 Shield A/B build). Native falls back to Kotlin by itself when the bridge is unavailable.
# DV_MKV_NATIVE_PIPELINE=true
