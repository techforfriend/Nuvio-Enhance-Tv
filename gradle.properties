# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Daemon args = Youtube-KE / Android-TV-Launcher's, byte for byte (Spec 32 G8, Arshad 2026-10-19), so an
# idle daemon of the same Gradle version + JDK can be reused across the three projects; change all three
# or none. Measured (Spec 32 P4 record), summed Gradle + Kotlin daemon RSS: cold clean release build
# 5.2 GB, incremental 4.35 GB; the old in-process 3G/512m floor: 5.2 GB first / 4.6 GB incremental, and it
# hit its metaspace cap. R8 fits in 2G. Neither fits a 4 GB budget: cold builds need a quiet desktop.
# workers.max and the idle timeout are not daemon-compatibility criteria, so they stay project-local.
# Raised 2048m -> 4096m: :app:packageFullDebug OOMs on CI
# (OutOfMemoryError: Java heap space in zipflinger Compressor.deflate while
# splitting the APK — runs 42340494523 and 42341512909 both died there).
# The GitHub runner has 16 GB RAM; the Kotlin daemon stays at 2048m
# (compile already fits). This breaks the Spec 32 G8 byte-for-byte daemon
# sync with Youtube-KE / Android-TV-Launcher, deliberately: those build on
# a desktop, this one must also build on CI.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx2048m
kotlin.daemon.useFallbackStrategy=false
# Daemons must die when work pauses instead of squatting heap for hours.
org.gradle.daemon.idletimeout=900000
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true